<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Giao việc làm thêm')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar('giaoLamThem')}"></div>

        <main class="col-md-9 col-lg-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0"><i class="bi bi-clipboard-plus"></i> Giao việc làm thêm</h4>
                <a th:href="@{/manager/overtime/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Tạo lệnh làm thêm
                </a>
            </div>

            <div th:if="${thanhCong}" class="alert alert-success" th:text="${thanhCong}"></div>
            <div th:if="${loi}" class="alert alert-danger" th:text="${loi}"></div>

            <div class="card shadow-sm">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Nhân viên</th>
                        <th style="width: 110px">Ngày</th>
                        <th style="width: 90px">Thứ</th>
                        <th style="width: 130px">Khung giờ</th>
                        <th style="width: 110px">Số giờ</th>
                        <th>Lý do</th>
                        <th style="width: 130px">Trạng thái</th>
                        <th>Ghi chú của nhân viên</th>
                        <th style="width: 100px" class="text-end">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${danhSach}">
                        <td th:text="${r.employeeName}"></td>
                        <td th:text="${r.ngay}"></td>
                        <td th:text="${r.thu}"></td>
                        <td th:text="${r.khungGio}"></td>
                        <td th:text="${r.soGio}"></td>
                        <td th:text="${r.reason}"></td>
                        <td>
                                <span class="badge" th:classappend="'text-bg-' + ${r.statusBadge}"
                                      th:text="${r.statusLabel}"></span>
                        </td>
                        <td th:text="${r.responseNote} ?: '-'"></td>
                        <td class="text-end">
                            <form th:if="${r.coTheHuy}"
                                  th:action="@{/manager/overtime/{id}/cancel(id=${r.id})}" method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Bạn chắc chắn muốn hủy lệnh này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-x-circle"></i> Hủy
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(danhSach)}">
                        <td colspan="9" class="text-center text-muted py-4">Bạn chưa tạo lệnh làm thêm nào</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

</body>
</html>
