<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Phòng ban')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar('phongban')}"></div>

        <main class="col-md-9 col-lg-10 p-4">
            <h4 class="mb-3" th:text="${tieuDe}">Tiêu đề</h4>

            <div class="card shadow-sm" style="max-width: 560px;">
                <div class="card-body">
                    <form th:action="@{${action}}" th:object="${form}" method="post" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Tên phòng ban</label>
                            <input type="text" th:field="*{name}" class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" autofocus>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Lưu</button>
                        <a th:href="@{/admin/departments}" class="btn btn-outline-secondary">Hủy</a>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
