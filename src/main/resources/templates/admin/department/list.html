<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Phòng ban')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar('phongban')}"></div>

        <main class="col-md-9 col-lg-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0"><i class="bi bi-building"></i> Quản lý phòng ban</h4>
                <a th:href="@{/admin/departments/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Thêm phòng ban
                </a>
            </div>

            <div th:if="${thanhCong}" class="alert alert-success" th:text="${thanhCong}"></div>
            <div th:if="${loi}" class="alert alert-danger" th:text="${loi}"></div>

            <div class="card shadow-sm">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 80px">Mã</th>
                        <th>Tên phòng ban</th>
                        <th style="width: 140px">Số nhân viên</th>
                        <th style="width: 180px" class="text-end">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="pb : ${danhSach}">
                        <td th:text="${pb.id}"></td>
                        <td th:text="${pb.name}"></td>
                        <td th:text="${pb.soNhanVien}"></td>
                        <td class="text-end">
                            <a th:href="@{/admin/departments/{id}/edit(id=${pb.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i> Sửa
                            </a>
                            <form th:action="@{/admin/departments/{id}/delete(id=${pb.id})}" method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Bạn chắc chắn muốn xóa phòng ban này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i> Xóa
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(danhSach)}">
                        <td colspan="4" class="text-center text-muted py-4">Chưa có phòng ban nào</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

</body>
</html>
