<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<!-- Phần <head> dùng chung, nhận tham số là tiêu đề trang -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Quản lý nghỉ phép'">Trang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body>

<!-- Thanh trên: tên hệ thống, người dùng, nút đăng xuất -->
<nav th:fragment="navbar" class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand"><i class="bi bi-calendar-check"></i> Quản lý nghỉ phép và chấm công</span>
    <div class="d-flex align-items-center">
        <span class="text-white me-3"><i class="bi bi-person-circle"></i> <span th:text="${tenNguoiDung}"></span></span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-light btn-sm">Đăng xuất</button>
        </form>
    </div>
</nav>

<!-- Menu bên trái, tham số "active" cho biết mục nào đang được chọn -->
<nav th:fragment="sidebar(active)" class="col-md-3 col-lg-2 bg-white border-end p-3" style="min-height: calc(100vh - 56px);">
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'trangchu'} ? 'active fw-bold'" th:href="@{/}">
                <i class="bi bi-house"></i> Trang chủ
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'donCuaToi'} ? 'active fw-bold'" th:href="@{/leave-requests}">
                <i class="bi bi-journal-text"></i> Đơn nghỉ phép của tôi
            </a>
        </li>
        <li class="nav-item" th:if="${isAdmin}">
            <a class="nav-link" th:classappend="${active == 'phongban'} ? 'active fw-bold'" th:href="@{/admin/departments}">
                <i class="bi bi-building"></i> Phòng ban
            </a>
        </li>
        <li class="nav-item" th:if="${isAdmin}">
            <a class="nav-link" th:classappend="${active == 'nguoidung'} ? 'active fw-bold'" th:href="@{/admin/users}">
                <i class="bi bi-people"></i> Người dùng
            </a>
        </li>
        <li class="nav-item" th:if="${isAdmin}">
            <a class="nav-link" th:classappend="${active == 'loainghi'} ? 'active fw-bold'" th:href="@{/admin/leave-types}">
                <i class="bi bi-calendar-event"></i> Loại nghỉ phép
            </a>
        </li>
    </ul>
</nav>

</body>
</html>
