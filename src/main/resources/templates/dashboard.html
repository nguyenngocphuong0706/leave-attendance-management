<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Trang chủ')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{fragments/layout :: sidebar('trangchu')}"></div>

        <main class="col-md-9 col-lg-10 p-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4>Xin chào, <span th:text="${profile.fullName}"></span></h4>
                    <table class="table mt-3 mb-0">
                        <tr><th style="width: 200px">Email</th><td th:text="${profile.email}"></td></tr>
                        <tr><th>Vai trò</th><td th:text="${profile.role}"></td></tr>
                        <tr><th>Phòng ban</th><td th:text="${profile.departmentName}"></td></tr>
                        <tr><th>Quản lý trực tiếp</th><td th:text="${profile.managerName}"></td></tr>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
