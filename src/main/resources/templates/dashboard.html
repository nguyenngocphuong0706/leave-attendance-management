<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trang chủ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Quản lý nghỉ phép và chấm công</span>
    <form th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="btn btn-outline-light btn-sm">Đăng xuất</button>
    </form>
</nav>

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4>Xin chào, <span th:text="${profile.fullName}"></span></h4>
            <table class="table mt-3 mb-0">
                <tr><th style="width: 200px">Email</th><td th:text="${profile.email}"></td></tr>
                <tr><th>Vai trò</th><td th:text="${profile.role}"></td></tr>
                <tr><th>Phòng ban</th><td th:text="${profile.departmentName}"></td></tr>
                <tr><th>Quản lý trực tiếp</th><td th:text="${profile.managerName}"></td></tr>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <a th:if="${profile.role.name() == 'MANAGER' or profile.role.name() == 'ADMIN'}"
           th:href="@{/manager/test}" class="btn btn-outline-primary btn-sm">Trang quản lý (thử)</a>
        <a th:if="${profile.role.name() == 'ADMIN'}"
           th:href="@{/admin/test}" class="btn btn-outline-danger btn-sm">Trang admin (thử)</a>
    </div>
</div>
</body>
</html>
