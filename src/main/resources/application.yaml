spring:
  application:
    name: lams
  datasource:
    url: jdbc:postgresql://localhost:5432/lams
    username: lams_user
    password: lams_pass
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true