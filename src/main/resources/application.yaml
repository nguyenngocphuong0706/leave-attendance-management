spring:
  application:
    name: lams
  datasource:
    url: jdbc:postgresql://localhost:5432/lams
    username: lams_user
    password: lams_pass
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

# Quy tắc chấm công của công ty, đổi ở đây là đổi quy tắc, không cần sửa code
lams:
  attendance:
    work-start: "08:30"
    work-end: "17:30"
    late-grace-minutes: 15
    zone: Asia/Ho_Chi_Minh